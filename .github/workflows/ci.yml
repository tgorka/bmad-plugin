name: Quality

on:
  push:
    branches: [dev, main]
  # Every pull request, not only those based on dev/main. Related work
  # ships as a stack of one-concern PRs, so all but the bottom one is
  # based on another branch of the stack — with a branch filter here they
  # were reported as having no checks at all rather than as failing.
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      # `uv` is a declared prerequisite of the plugin itself — bmad-build
      # and bmad-build-auto are loaders that halt without it — and the
      # init-script tests resolve customization through the real
      # `_bmad/scripts/*.py`, which run under `uv run`.
      - uses: astral-sh/setup-uv@v5

      - run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Validate plugin
        run: bun run validate

      - name: Unit tests
        run: bun run test:unit
